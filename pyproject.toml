[project]
name = "free-node-sub"
version = "0.1.0"
description = "抓取 GitHub 免费 Clash 节点，整理去重测活，导出 Clash / sing-box 订阅文件并自动更新到 Satelite"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
lint = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freenodes"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
